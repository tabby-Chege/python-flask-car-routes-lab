<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Flatiron Cars homepage</title>
  <desc id="desc">A stylized Flask route example for the Flatiron Cars app.</desc>
  <rect width="1200" height="700" fill="#f4f7fb"/>
  <rect x="80" y="80" width="1040" height="540" rx="24" fill="#ffffff" stroke="#dfe8f5" stroke-width="3"/>
  <text x="600" y="180" text-anchor="middle" font-size="42" font-family="Arial, sans-serif" fill="#1f2937" font-weight="700">Flatiron Cars</text>
  <text x="600" y="255" text-anchor="middle" font-size="28" font-family="Arial, sans-serif" fill="#374151">Welcome to Flatiron Cars</text>
  <rect x="250" y="310" width="700" height="110" rx="16" fill="#eaf2ff"/>
  <text x="600" y="372" text-anchor="middle" font-size="26" font-family="Arial, sans-serif" fill="#1d4ed8">GET /Crossroads → Flatiron Crossroads is in our fleet!</text>
  <rect x="320" y="470" width="560" height="72" rx="16" fill="#ecfeff"/>
  <text x="600" y="517" text-anchor="middle" font-size="24" font-family="Arial, sans-serif" fill="#0f766e">GET /realCar → No models called realCar exists in our catalog</text>
</svg>
